name: Personal Release Build

# Dupi's fork only: builds the personal integration branch's Android APK and Linux
# desktop packages whenever a personal-* tag is pushed, and attaches them to that
# tag's GitHub Release. Never runs on stablyai/orca (no personal-* tags there).
on:
  push:
    tags:
      - 'personal-*'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build Android release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same chain as a local build:linux (typecheck → relay → cli → vite → web →
      # mobile-web → electron-builder). CI runners have a clean tar/xz, so all
      # three targets build; only the deb and AppImage are shipped.
      - name: Build Linux desktop packages
        run: pnpm run build:linux

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-linux-appimage
          path: dist/orca-linux.AppImage

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-linux-deb
          path: dist/*.deb

  release:
    needs: [android, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="$RUNNER_TEMP/notes.md"
            printf 'Personal integration build from %s.\n\nBuilt by CI from the personal-* tag; see the commit list for contents.\n' "$GITHUB_SHA" > "$notes"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Personal integration build ($tag)" --prerelease --latest=false \
              --notes-file "$notes" --target "$GITHUB_SHA"
          fi

          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            artifacts/*.apk artifacts/*.deb artifacts/*.AppImage
