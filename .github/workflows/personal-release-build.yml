name: Personal Release Build

# Dupi's fork only: builds the personal integration branch's Android APK, desktop
# packages (Linux AppImage/deb, macOS dmg — unsigned, both architectures) and an
# unsigned iOS IPA whenever a personal-* tag is pushed, and attaches them to that
# tag's GitHub Release. Never runs on stablyai/orca (no personal-* tags there).
on:
  push:
    tags:
      - 'personal-*'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # Baked into the release JS bundle by Metro (EXPO_PUBLIC_* inlining) so the
    # phone's About screen names the exact personal build it runs.
    env:
      EXPO_PUBLIC_ORCA_BUILD_VARIANT: dudupii/${{ github.ref_name }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Give the APK the desktop personal version's shape (x.y.z-<9-hex>) so the
      # About screen names the exact build. prebuild flows app.json's version
      # into both the native versionName and the runtime expoConfig the About
      # screen reads, so rewriting it once feeds both; the versionCode step
      # below still owns upgrade detection. Fail loud on either half missing —
      # a suffix-less version would read as an official build.
      - name: Stamp personal version suffix into app.json
        run: |
          set -euo pipefail
          base="$(node -p "require('./app.json').expo.version")"
          short9="${GITHUB_SHA:0:9}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "app.json expo.version is not a plain x.y.z base: '$base'" >&2
            exit 1
          fi
          if [[ ! "$short9" =~ ^[0-9a-f]{9}$ ]]; then
            echo "GITHUB_SHA did not yield a 9-char lowercase hex prefix: '$short9'" >&2
            exit 1
          fi
          version="${base}-${short9}"
          if [[ "$(grep -c '^    "version":' app.json)" -ne 1 ]]; then
            echo "expected exactly one expo.version line in app.json" >&2
            exit 1
          fi
          sed -i "s/^\(    \"version\": \"\)[^\"]*\"/\1${version}\"/" app.json
          if [[ "$(node -p "require('./app.json').expo.version")" != "$version" ]]; then
            echo "app.json expo.version was not rewritten to '${version}'" >&2
            exit 1
          fi

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      # app.json's versionCode (18) never changes between personal releases,
      # and Android can treat a same-code APK as no update. prebuild writes the
      # literal into build.gradle, and gradle's android.injected.version.code
      # property does NOT override it from the command line, so patch the
      # generated file directly: 1900 + run_number is strictly increasing.
      - name: Give this build a unique versionCode
        run: sed -i "s/^        versionCode .*/        versionCode $((1900 + GITHUB_RUN_NUMBER))/" android/app/build.gradle

      - name: Build Android release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Why: build:desktop now ends in build:mobile-web, whose esbuild resolves
      # React Native and Expo from mobile/node_modules (upstream release jobs
      # install mobile deps for the same reason).
      - uses: ./.github/actions/install-mobile-dependencies

      # The personal channel's identity IS its version shape: the desktop updater
      # recognizes `x.y.z-<9-hex>` as this fork's personal channel and maps it to
      # this repo's personal-<version> tags. A build that silently lost its suffix
      # would look like an official stable release to every updater, so both
      # halves are validated fail-loud before anything is built.
      - name: Compute personal build version
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          short9="${GITHUB_SHA:0:9}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version is not a plain x.y.z base: '$base'" >&2
            exit 1
          fi
          if [[ ! "$short9" =~ ^[0-9a-f]{9}$ ]]; then
            echo "GITHUB_SHA did not yield a 9-char lowercase hex prefix: '$short9'" >&2
            exit 1
          fi
          echo "PERSONAL_BUILD_VERSION=${base}-${short9}" >> "$GITHUB_ENV"

      # Same chain as a local build:linux (typecheck → relay → cli → vite → web →
      # mobile-web → electron-builder). CI runners have a clean tar/xz, so all
      # three targets build; only the deb and AppImage are shipped.
      # --publish never: on a tag push electron-builder would otherwise
      # implicitly publish to GitHub Releases (needs GH_TOKEN, which this job
      # doesn't have). The release job below owns all uploads.
      # --config.extraMetadata.version: the personal version above overrides the
      # package.json version electron-builder would otherwise stamp, so the deb
      # filename and the app's About version carry the channel-identifying
      # suffix (the AppImage name is version-less, so upload globs stay put).
      - name: Build Linux desktop packages
        run: pnpm run build:linux -- --publish never --config.extraMetadata.version="$PERSONAL_BUILD_VERSION"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-linux-appimage
          # The name carries the personal version (orca-linux-personal-<version>.AppImage); arm64 adds -arm64.
          path: dist/orca-linux*.AppImage

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-linux-deb
          path: dist/*.deb

  # Mirrors the upstream mac release job's install/build recipe, minus signing:
  # no CSC_LINK/Apple ID secrets here, so build:mac produces an unsigned local
  # build (same as running build:mac on a personal Mac). Gatekeeper will ask
  # once on first launch — right-click → Open, or clear the quarantine xattr.
  mac:
    # Pin macOS 15: upstream runs every mac packaging job (release/daily/hourly/
    # adhoc) on macOS 15 runners, and the afterPack x64-terminal-host PTY gate
    # (required in CI) is only proven there. macos-latest now resolves to
    # macos-26, where the gate's 20s Rosetta boot budget timed out (run
    # 43791338874). iOS deliberately stays on macos-26 for its toolchain.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Hosted 3-vCPU arm64 runners cold-translate the x64 helper past the
      # verifier's default 20s budget; upstream never sees this on 6-vCPU runners.
      ORCA_TERMINAL_HOST_BOOT_TIMEOUT_MS: '90000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      # Why both CPUs: the mac config packages x64 and arm64 dmgs from this
      # arm64 runner, so the native modules for both architectures must be
      # installed (same flags as the upstream mac release job).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --cpu=current,x64,arm64

      # Why: electron-builder's beforePack needs out/mobile-web, whose bundle
      # resolves React Native and Expo from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      # Same shape and rationale as the linux job's compute step; see there.
      - name: Compute personal build version
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          short9="${GITHUB_SHA:0:9}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version is not a plain x.y.z base: '$base'" >&2
            exit 1
          fi
          if [[ ! "$short9" =~ ^[0-9a-f]{9}$ ]]; then
            echo "GITHUB_SHA did not yield a 9-char lowercase hex prefix: '$short9'" >&2
            exit 1
          fi
          echo "PERSONAL_BUILD_VERSION=${base}-${short9}" >> "$GITHUB_ENV"

      # Same chain as a local build:mac; the mac config builds dmg + zip for
      # x64 and arm64 in one electron-builder run. --publish never for the
      # same reason as the linux job: the release job owns uploads.
      # --config.extraMetadata.version: the personal version above must also
      # beat build-mac-local.mjs's own ORCA_LOCAL_BUILD_VERSION stamp (a
      # local.<timestamp>.<commit> shape the personal channel would not
      # recognize) — CLI dot-notation overrides win app-builder-lib's config
      # merge, so the packaged app's version (About page, updater identity)
      # keeps the channel-recognizable shape. The dmg filename itself is
      # version-less, so upload globs stay put.
      - name: Build macOS packages
        run: pnpm run build:mac -- --publish never --config.extraMetadata.version="$PERSONAL_BUILD_VERSION"

      - name: Upload dmg artifacts
        uses: actions/upload-artifact@v7
        with:
          name: personal-macos-dmg
          path: dist/orca-macos-*.dmg

  # Unsigned IPA: no Apple signing secrets on this fork, so the archive skips
  # codesigning entirely and the IPA is signed at install time with the user's
  # own Apple ID (Sideloadly/AltStore). A free Apple ID's signature expires
  # after 7 days, so a new sign — not a new build — is what re-enables the app.
  ios:
    runs-on: macos-26
    # Expo SDK 55's expo-modules-core needs the Swift 6 toolchain, which means
    # Xcode 26.x — same requirement as the upstream mobile-ios-release job.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_ORCA_BUILD_VARIANT: dudupii/${{ github.ref_name }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install ios

      # CODE_SIGNING_ALLOWED=NO archives without touching any keychain; the
      # .app inside the .xcarchive is then zipped into an IPA layout as-is.
      - name: Archive and package unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Orca.xcworkspace -scheme Orca \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/Orca.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          mkdir -p build/Payload
          cp -R build/Orca.xcarchive/Products/Applications/Orca.app build/Payload/
          (cd build && zip -qry Orca-ios-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-ios-ipa
          path: mobile/build/Orca-ios-unsigned.ipa

  release:
    needs: [android, linux, mac, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # Same shape and rationale as the linux job's compute step; see there.
      - name: Compute personal build version
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          short9="${GITHUB_SHA:0:9}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version is not a plain x.y.z base: '$base'" >&2
            exit 1
          fi
          if [[ ! "$short9" =~ ^[0-9a-f]{9}$ ]]; then
            echo "GITHUB_SHA did not yield a 9-char lowercase hex prefix: '$short9'" >&2
            exit 1
          fi
          echo "PERSONAL_BUILD_VERSION=${base}-${short9}" >> "$GITHUB_ENV"

      - name: Attach to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="$RUNNER_TEMP/notes.md"
            printf 'Personal integration build from %s.\n\nBuilt by CI from the personal-* tag; see the commit list for contents.\n' "$GITHUB_SHA" > "$notes"
            # A full (non-prerelease) release so GitHub names it Latest: the API refuses the
            # Latest designation on prereleases. Both personal updaters order builds by
            # created_at and filter personal-* tags only, so the flag change is display-only.
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Personal integration build ($tag)" --latest \
              --notes-file "$notes" --target "$GITHUB_SHA"
          fi

          # The APK and IPA carry no electron-builder manifest, so they are renamed here; the
          # desktop formats take their names from the builder's own templates (see
          # isPersonalArtifactBuild in config/electron-builder.config.cjs).
          if [ -f artifacts/app-release.apk ]; then
            mv artifacts/app-release.apk "artifacts/Orca-personal-${PERSONAL_BUILD_VERSION}.apk"
          fi
          if [ -f artifacts/Orca-ios-unsigned.ipa ]; then
            mv artifacts/Orca-ios-unsigned.ipa "artifacts/Orca-personal-${PERSONAL_BUILD_VERSION}.ipa"
          fi

          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            artifacts/*.apk artifacts/*.deb artifacts/*.AppImage artifacts/*.dmg \
            artifacts/*.ipa
