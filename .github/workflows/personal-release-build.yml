name: Personal Release Build

# Dupi's fork only: builds the personal integration branch's Android APK and desktop
# packages (Linux AppImage/deb, macOS dmg — unsigned, both architectures) whenever a
# personal-* tag is pushed, and attaches them to that tag's GitHub Release. Never runs
# on stablyai/orca (no personal-* tags there).
on:
  push:
    tags:
      - 'personal-*'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # Baked into the release JS bundle by Metro (EXPO_PUBLIC_* inlining) so the
    # phone's About screen names the exact personal build it runs.
    env:
      EXPO_PUBLIC_ORCA_BUILD_VARIANT: dudupii/${{ github.ref_name }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      # app.json's versionCode 18 never changes between personal releases, and
      # Android treats a same-code APK as no update on some OEM installers, so
      # each release needs a strictly higher code. Bash arithmetic, not a
      # workflow expression: expressions have no + operator.
      - name: Build Android release APK
        run: cd android && ./gradlew assembleRelease -Pandroid.injected.version.code=$((1900 + GITHUB_RUN_NUMBER))

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same chain as a local build:linux (typecheck → relay → cli → vite → web →
      # mobile-web → electron-builder). CI runners have a clean tar/xz, so all
      # three targets build; only the deb and AppImage are shipped.
      # --publish never: on a tag push electron-builder would otherwise
      # implicitly publish to GitHub Releases (needs GH_TOKEN, which this job
      # doesn't have). The release job below owns all uploads.
      - name: Build Linux desktop packages
        run: pnpm run build:linux -- --publish never

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-linux-appimage
          path: dist/orca-linux.AppImage

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-linux-deb
          path: dist/*.deb

  # Mirrors the upstream mac release job's install/build recipe, minus signing:
  # no CSC_LINK/Apple ID secrets here, so build:mac produces an unsigned local
  # build (same as running build:mac on a personal Mac). Gatekeeper will ask
  # once on first launch — right-click → Open, or clear the quarantine xattr.
  mac:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      # Why both CPUs: the mac config packages x64 and arm64 dmgs from this
      # arm64 runner, so the native modules for both architectures must be
      # installed (same flags as the upstream mac release job).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --cpu=current,x64,arm64

      # Same chain as a local build:mac; the mac config builds dmg + zip for
      # x64 and arm64 in one electron-builder run. --publish never for the
      # same reason as the linux job: the release job owns uploads.
      - name: Build macOS packages
        run: pnpm run build:mac -- --publish never

      - name: Upload dmg artifacts
        uses: actions/upload-artifact@v7
        with:
          name: personal-macos-dmg
          path: dist/orca-macos-*.dmg

  release:
    needs: [android, linux, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="$RUNNER_TEMP/notes.md"
            printf 'Personal integration build from %s.\n\nBuilt by CI from the personal-* tag; see the commit list for contents.\n' "$GITHUB_SHA" > "$notes"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Personal integration build ($tag)" --prerelease --latest=false \
              --notes-file "$notes" --target "$GITHUB_SHA"
          fi

          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            artifacts/*.apk artifacts/*.deb artifacts/*.AppImage artifacts/*.dmg
